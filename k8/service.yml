apiVersion: v1
kind: Service
metadata:
  name: ingress-wildcard-host
  namespace: production
spec:
  ports:
  - port: 8080
    targetPort: 80
    name: web
  selector:
    app: my-app
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ingress-wildcard-host-statefulset
  namespace: production
spec:
  selector:
    matchLabels:
      app: my-app # has to match .spec.template.metadata.labels
  serviceName: "my-app"
  replicas: 3 # by default is 1
  minReadySeconds: 10 # by default is 0
  template:
    metadata:
      labels:
        app: my-app # has to match .spec.selector.matchLabels
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: nginx
        image: fullstack-demo:1.0
        ports:
        - containerPort: 80
          name: web
        volumeMounts:
        - name: www
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "standard"
      resources:
        requests:
          storage: 1Gi
